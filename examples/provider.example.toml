# 候选 provider 示例，不包含全局切换指令。所有占位值在目标机替换。
# 这是保留 ChatGPT 云端登录的一种认证分支；其他云端认证方式按原配置适配。
[model_providers.cloud-local-router]
name = "Existing cloud and selected local models"
base_url = "http://127.0.0.1:ROUTER_PORT/CODEX_API_PREFIX"
wire_api = "responses"
requires_openai_auth = true

# 只有网关采用经验证的 HTTP SSE 路径时才选择此值。
supports_websockets = false

# 本机密钥仅保存在设备私有配置中。若采用环境变量，验证实际客户端能继承。
[model_providers.cloud-local-router.http_headers]
X-Codex-Gateway-Key = "REPLACE_WITH_DEVICE_GATEWAY_CREDENTIAL"

# model_catalog_url 按目标实现填写；使用本地完整目录时它可能被优先级覆盖。
# 验证通过后，在用户配置第一个 table 之前设置实际顶层选择：
# model = "TARGET_EXISTING_CLOUD_DEFAULT"
# model_provider = "cloud-local-router"
# model_catalog_json = "/ACTUAL/ABSOLUTE/PATH/combined-models.json"
